<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Launcher</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070913">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070913;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      margin-bottom: 2rem;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .grid {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      width: 280px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 0 20px rgba(56,189,248,0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: #a855f7;
    }
    .card h2 {
      margin-bottom: 0.75rem;
      font-size: 1.5rem;
    }
    .card p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: opacity 0.2s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <h1>Select a Game</h1>

  <div class="grid">
    <!-- Game 1: Flappy Bird -->
    <div class="card">
      <h2>Flappy Bird</h2>
      <p>Tap or press space to fly through the pipes without crashing.</p>
      <a href="flappybird.html" class="btn">Play Flappy Bird</a>
    </div>

    <!-- Game 2: Level Devil -->
    <div class="card">
      <h2>Level Devil</h2>
      <p>A platformer where traps are everywhere. Reach the door to win!</p>
      <a href="leveldevil.html" class="btn">Play Level Devil</a>
    </div>

    <!-- Game 3: Memory Card -->
    <div class="card">
      <h2>Memory Card</h2>
      <p>Test your memory by matching all the pairs of icons correctly.</p>
      <a href="memorycard.html" class="btn">Play Memory Card</a>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
