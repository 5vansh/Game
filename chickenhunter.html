<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chicken Hunter 2D - Deluxe Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      cursor: none;
    }
    canvas {
      border: 3px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: block;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="960" height="540"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Game State Variables ---
let currentLevel = 1;
let score = 0;
let ammo = 5;
let maxAmmo = 5;
let targetScore = 100;
let timer = 30;
let timerInterval = null;
let gameState = 'START';

const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

// --- Level Configuration (Escalating Difficulty) ---
const levelConfigs = {
  1: { maxAmmo: 5, targetScore: 100, spawnRate: 1500, chickenSpeed: 0.9, timer: 30 },
  2: { maxAmmo: 7, targetScore: 150, spawnRate: 1100, chickenSpeed: 1.4, timer: 25 },
  3: { maxAmmo: 10, targetScore: 220, spawnRate: 750, chickenSpeed: 2.0, timer: 20 }
};

let chickens = [];
let particles = [];
let hitEffects = [];
let spawnTimer = null;

function getDist(x1, y1, x2, y2) {
  return Math.hypot(x2 - x1, y2 - y1);
}

// --- Background with Mountain & Field Grass ---
function drawBackground() {
  // Sky Gradient
  let sky = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
  sky.addColorStop(0, '#4A627A');
  sky.addColorStop(1, '#A8B9CC');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Distant Mountains
  ctx.fillStyle = '#3F4A56';
  ctx.beginPath();
  ctx.moveTo(0, 270);
  ctx.lineTo(220, 190);
  ctx.lineTo(480, 250);
  ctx.lineTo(760, 160);
  ctx.lineTo(canvas.width, 230);
  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.fill();

  // Mountain Grass Patches
  drawMountainGrass(180, 205);
  drawMountainGrass(210, 195);
  drawMountainGrass(450, 255);
  drawMountainGrass(730, 175);
  drawMountainGrass(750, 168);

  // Distant Hills
  ctx.fillStyle = '#785F31';
  ctx.beginPath();
  ctx.ellipse(200, 330, 320, 90, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#614B24';
  ctx.beginPath();
  ctx.ellipse(750, 340, 420, 100, 0, 0, Math.PI * 2);
  ctx.fill();

  // Foreground Field
  let field = ctx.createLinearGradient(0, 310, 0, canvas.height);
  field.addColorStop(0, '#BBA043');
  field.addColorStop(1, '#6F5C1A');
  ctx.fillStyle = field;
  ctx.fillRect(0, 310, canvas.width, canvas.height - 310);

  // Foreground Grass Blades along field edge
  drawFieldGrass();

  drawWindmill(820, 250);
}

function drawMountainGrass(x, y) {
  ctx.fillStyle = '#2D4A27';
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x - 3, y - 10); ctx.lineTo(x + 2, y);
  ctx.moveTo(x + 3, y); ctx.lineTo(x + 5, y - 14); ctx.lineTo(x + 7, y);
  ctx.moveTo(x + 8, y); ctx.lineTo(x + 12, y - 9); ctx.lineTo(x + 13, y);
  ctx.fill();
}

function drawFieldGrass() {
  ctx.strokeStyle = '#4A6B22';
  ctx.lineWidth = 2;
  for (let x = 10; x < canvas.width; x += 45) {
    let baseY = 310 + (Math.sin(x) * 4);
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x - 5, baseY - 15, x - 10, baseY - 20);
    ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x + 2, baseY - 18, x + 5, baseY - 25);
    ctx.stroke();
  }
}

let windmillAngle = 0;
function drawWindmill(x, y) {
  ctx.fillStyle = '#42342C';
  ctx.beginPath();
  ctx.moveTo(x - 20, y + 100);
  ctx.lineTo(x + 20, y + 100);
  ctx.lineTo(x + 10, y);
  ctx.lineTo(x - 10, y);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#261E18';
  ctx.beginPath();
  ctx.arc(x, y, 12, Math.PI, 0);
  ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  windmillAngle += 0.01;
  ctx.rotate(windmillAngle);
  ctx.fillStyle = '#C7B8AC';
  for (let i = 0; i < 4; i++) {
    ctx.rotate(Math.PI / 2);
    ctx.fillRect(-3, 0, 6, 70);
  }
  ctx.restore();
}

// --- Redesigned Chicken Class ---
class Chicken {
  constructor(speedMultiplier) {
    this.size = 38 + Math.random() * 16;
    this.isForeground = Math.random() < 0.18;
    if (this.isForeground) {
      this.size = 135;
    }

    this.direction = Math.random() < 0.5 ? 1 : -1;
    this.x = this.direction === 1 ? -this.size : canvas.width + this.size;
    this.y = this.isForeground 
      ? canvas.height - 110 
      : 70 + Math.random() * 210;

    this.vx = (0.7 + Math.random() * 0.6) * speedMultiplier * this.direction;
    this.baseY = this.y;
    this.floatOffset = Math.random() * 10;

    this.wingAngle = Math.random() * Math.PI;
    this.wingSpeed = 0.12; 

    this.alive = true;
    this.rotation = 0;
    this.fallSpeed = 0;
  }

  update() {
    if (this.alive) {
      this.x += this.vx;
      this.floatOffset += 0.04;
      this.y = this.baseY + Math.sin(this.floatOffset) * 12;
      this.wingAngle += this.wingSpeed;
    } else {
      this.fallSpeed += 0.35;
      this.y += this.fallSpeed;
      this.rotation += 0.15 * this.direction;
      this.wingAngle += 0.3;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    if (this.direction === -1 && this.alive) ctx.scale(-1, 1);

    let s = this.size;
    let wingCycle = Math.sin(this.wingAngle);

    // Redesigned Body & Tail Feathers
    ctx.fillStyle = '#D97706';
    ctx.beginPath();
    ctx.moveTo(-s * 0.4, 0);
    ctx.lineTo(-s * 0.7, -s * 0.25);
    ctx.lineTo(-s * 0.55, 0);
    ctx.lineTo(-s * 0.75, s * 0.1);
    ctx.lineTo(-s * 0.3, s * 0.2);
    ctx.closePath();
    ctx.fill();

    // Main Oval Body (Rounded Cartoon Look)
    ctx.fillStyle = '#F59E0B';
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.48, s * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();

    // Plump Neck & Head
    ctx.fillStyle = '#FBBF24';
    ctx.beginPath();
    ctx.arc(s * 0.38, -s * 0.22, s * 0.26, 0, Math.PI * 2);
    ctx.fill();

    // Big Cartoony Googly Eye
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(s * 0.42, -s * 0.28, s * 0.13, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#78350F';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#1E1B4B';
    ctx.beginPath();
    ctx.arc(s * 0.45 + Math.cos(this.wingAngle) * 2, -s * 0.28, s * 0.06, 0, Math.PI * 2);
    ctx.fill();

    // Expression Beak
    ctx.fillStyle = '#EA580C';
    ctx.beginPath();
    ctx.moveTo(s * 0.58, -s * 0.26);
    ctx.lineTo(s * 0.9, -s * 0.16);
    ctx.lineTo(s * 0.58, -s * 0.04);
    ctx.closePath();
    ctx.fill();

    // Red Wattle Under Beak
    ctx.fillStyle = '#DC2626';
    ctx.beginPath();
    ctx.ellipse(s * 0.55, -s * 0.02, s * 0.07, s * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // 3-Pointed Crown Comb
    ctx.fillStyle = '#EF4444';
    ctx.beginPath();
    ctx.arc(s * 0.32, -s * 0.46, s * 0.09, 0, Math.PI * 2);
    ctx.arc(s * 0.44, -s * 0.5, s * 0.09, 0, Math.PI * 2);
    ctx.arc(s * 0.56, -s * 0.44, s * 0.09, 0, Math.PI * 2);
    ctx.fill();

    // Animated Wing
    ctx.save();
    ctx.translate(-s * 0.05, 0);
    ctx.rotate(wingCycle * 0.85);
    ctx.fillStyle = '#D97706';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.08, s * 0.3, s * 0.16, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }
}

// --- Particle Effects ---
class Feather {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 5;
    this.vy = (Math.random() - 0.7) * 4;
    this.size = 5 + Math.random() * 6;
    this.alpha = 1;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.15;
    this.color = Math.random() < 0.7 ? '#FDE68A' : '#D97706';
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.08;
    this.vx *= 0.98;
    this.alpha -= 0.012;
    this.rotation += this.rotSpeed;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size / 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class FloatingText {
  constructor(text, x, y) {
    this.text = text;
    this.x = x;
    this.y = y;
    this.alpha = 1;
    this.vy = -1.5;
  }
  update() {
    this.y += this.vy;
    this.alpha -= 0.02;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = '#FBBF24';
    ctx.font = 'bold 22px Arial';
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 3;
    ctx.strokeText(this.text, this.x, this.y);
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

// --- HUD & UI ---
function drawHUD() {
  ctx.fillStyle = 'white';
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'left';
  ctx.strokeStyle = 'black';
  ctx.lineWidth = 4;
  let timeStr = `0:${timer < 10 ? '0' : ''}${timer}`;
  ctx.strokeText(timeStr, 20, 40);
  ctx.fillText(timeStr, 20, 40);

  ctx.textAlign = 'right';
  let scoreStr = `Score: ${score} / ${targetScore}`;
  ctx.strokeText(scoreStr, canvas.width - 20, 40);
  ctx.fillText(scoreStr, canvas.width - 20, 40);

  ctx.textAlign = 'center';
  let lvlStr = `LEVEL ${currentLevel}`;
  ctx.strokeText(lvlStr, canvas.width / 2, 40);
  ctx.fillText(lvlStr, canvas.width / 2, 40);

  drawAmmoUI();

  if (ammo === 0) {
    ctx.fillStyle = '#EF4444';
    ctx.font = 'bold 28px Arial';
    ctx.strokeText('PRESS R / RIGHT CLICK TO RELOAD', canvas.width / 2, canvas.height - 30);
    ctx.fillText('PRESS R / RIGHT CLICK TO RELOAD', canvas.width / 2, canvas.height - 30);
  }
}

function drawAmmoUI() {
  let startX = canvas.width - 30;
  let startY = canvas.height - 40;
  let spacing = 18;

  for (let i = 0; i < maxAmmo; i++) {
    let bx = startX - i * spacing;
    let isAvailable = i < ammo;

    ctx.fillStyle = isAvailable ? '#DC2626' : '#4B5563';
    ctx.fillRect(bx - 6, startY - 25, 12, 22);

    ctx.fillStyle = isAvailable ? '#F59E0B' : '#374151';
    ctx.fillRect(bx - 7, startY - 3, 14, 8);
  }
}

// --- Crosshair ---
function drawCrosshair() {
  let x = mouse.x;
  let y = mouse.y;

  ctx.strokeStyle = '#00E5FF';
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#00E5FF';
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x - 22, y); ctx.lineTo(x - 10, y);
  ctx.moveTo(x + 10, y); ctx.lineTo(x + 22, y);
  ctx.moveTo(x, y - 22); ctx.lineTo(x, y - 10);
  ctx.moveTo(x, y + 10); ctx.lineTo(x, y + 22);
  ctx.stroke();
}

// --- Level Initialization & Score Reset Logic ---
function initLevel(lvl) {
  currentLevel = lvl;
  score = 0; // RESET SCORE FOR EVERY LEVEL
  let cfg = levelConfigs[lvl];
  maxAmmo = cfg.maxAmmo;
  ammo = maxAmmo;
  targetScore = cfg.targetScore;
  timer = cfg.timer;
  chickens = [];
  particles = [];
  hitEffects = [];

  clearInterval(spawnTimer);
  spawnTimer = setInterval(() => {
    if (gameState === 'PLAYING') {
      chickens.push(new Chicken(cfg.chickenSpeed));
    }
  }, cfg.spawnRate);

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (gameState === 'PLAYING') {
      timer--;
      if (timer <= 0) {
        checkLevelEnd();
      }
    }
  }, 1000);
}

function checkLevelEnd() {
  if (score >= targetScore) {
    if (currentLevel < 3) {
      gameState = 'LEVEL_COMPLETE';
    } else {
      gameState = 'VICTORY';
    }
  } else {
    gameState = 'GAME_OVER';
  }
}

function resetGame() {
  initLevel(1);
  gameState = 'PLAYING';
}

function handleShoot() {
  if (gameState !== 'PLAYING') return;
  if (ammo <= 0) return;

  ammo--;

  for (let i = chickens.length - 1; i >= 0; i--) {
    let c = chickens[i];
    if (c.alive && getDist(mouse.x, mouse.y, c.x, c.y) < c.size * 0.65) {
      c.alive = false;
      let addedScore = c.isForeground ? 30 : 15;
      score += addedScore;

      hitEffects.push(new FloatingText(`+${addedScore}`, c.x, c.y));

      for (let k = 0; k < 16; k++) {
        particles.push(new Feather(c.x, c.y));
      }
      break;
    }
  }
}

function reload() {
  if (gameState === 'PLAYING') {
    ammo = maxAmmo;
  }
}

// --- Event Listeners ---
canvas.addEventListener('mousemove', (e) => {
  let rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    if (gameState === 'START') {
      resetGame();
    } else if (gameState === 'LEVEL_COMPLETE') {
      initLevel(currentLevel + 1);
      gameState = 'PLAYING';
    } else if (gameState === 'GAME_OVER' || gameState === 'VICTORY') {
      resetGame();
    } else if (gameState === 'PLAYING') {
      handleShoot();
    }
  } else if (e.button === 2) {
    reload();
  }
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    reload();
  }
});

// --- Main Loop ---
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground();

  if (gameState === 'PLAYING') {
    for (let i = chickens.length - 1; i >= 0; i--) {
      let c = chickens[i];
      c.update();
      c.draw();

      if (c.y > canvas.height + 100 || c.x < -150 || c.x > canvas.width + 150) {
        chickens.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw();
      if (p.alpha <= 0) particles.splice(i, 1);
    }

    for (let i = hitEffects.length - 1; i >= 0; i--) {
      let fx = hitEffects[i];
      fx.update();
      fx.draw();
      if (fx.alpha <= 0) hitEffects.splice(i, 1);
    }

    drawHUD();
  } else {
    drawOverlay();
  }

  drawCrosshair();
  requestAnimationFrame(gameLoop);
}

// --- Overlays ---
function drawOverlay() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = 'center';
  ctx.fillStyle = 'white';
  ctx.strokeStyle = 'black';
  ctx.lineWidth = 5;

  if (gameState === 'START') {
    ctx.font = 'bold 42px Arial';
    ctx.strokeText('CHICKEN HUNTER 2D', canvas.width / 2, 200);
    ctx.fillText('CHICKEN HUNTER 2D', canvas.width / 2, 200);

    ctx.font = '20px Arial';
    ctx.strokeText('3 Escalating Difficulty Levels | Reload with "R" or Right-Click', canvas.width / 2, 260);
    ctx.fillText('3 Escalating Difficulty Levels | Reload with "R" or Right-Click', canvas.width / 2, 260);

    ctx.font = 'bold 26px Arial';
    ctx.fillStyle = '#F59E0B';
    ctx.strokeText('CLICK TO START GAME', canvas.width / 2, 340);
    ctx.fillText('CLICK TO START GAME', canvas.width / 2, 340);
  } 
  else if (gameState === 'LEVEL_COMPLETE') {
    ctx.font = 'bold 40px Arial';
    ctx.strokeText(`LEVEL ${currentLevel} COMPLETED!`, canvas.width / 2, 190);
    ctx.fillText(`LEVEL ${currentLevel} COMPLETED!`, canvas.width / 2, 190);

    ctx.font = '22px Arial';
    let nextAmmo = levelConfigs[currentLevel + 1].maxAmmo;
    ctx.strokeText(`Score Resets to 0 for Level ${currentLevel + 1}`, canvas.width / 2, 245);
    ctx.fillText(`Score Resets to 0 for Level ${currentLevel + 1}`, canvas.width / 2, 245);
    
    ctx.strokeText(`Level ${currentLevel + 1} Ammo Capacity: ${nextAmmo} Shells`, canvas.width / 2, 280);
    ctx.fillText(`Level ${currentLevel + 1} Ammo Capacity: ${nextAmmo} Shells`, canvas.width / 2, 280);

    ctx.font = 'bold 26px Arial';
    ctx.fillStyle = '#10B981';
    ctx.strokeText('CLICK FOR NEXT LEVEL', canvas.width / 2, 350);
    ctx.fillText('CLICK FOR NEXT LEVEL', canvas.width / 2, 350);
  } 
  else if (gameState === 'GAME_OVER') {
    ctx.font = 'bold 42px Arial';
    ctx.fillStyle = '#EF4444';
    ctx.strokeText('GAME OVER', canvas.width / 2, 200);
    ctx.fillText('GAME OVER', canvas.width / 2, 200);

    ctx.font = '22px Arial';
    ctx.fillStyle = 'white';
    ctx.strokeText(`Level Score: ${score} / ${targetScore}`, canvas.width / 2, 260);
    ctx.fillText(`Level Score: ${score} / ${targetScore}`, canvas.width / 2, 260);

    ctx.font = 'bold 26px Arial';
    ctx.fillStyle = '#F59E0B';
    ctx.strokeText('CLICK TO RESTART', canvas.width / 2, 340);
    ctx.fillText('CLICK TO RESTART', canvas.width / 2, 340);
  } 
  else if (gameState === 'VICTORY') {
    ctx.font = 'bold 42px Arial';
    ctx.fillStyle = '#10B981';
    ctx.strokeText('VICTORY! ALL 3 LEVELS CLEARED!', canvas.width / 2, 200);
    ctx.fillText('VICTORY! ALL 3 LEVELS CLEARED!', canvas.width / 2, 200);

    ctx.font = '22px Arial';
    ctx.fillStyle = 'white';
    ctx.strokeText(`Final Level Score: ${score}`, canvas.width / 2, 260);
    ctx.fillText(`Final Level Score: ${score}`, canvas.width / 2, 260);

    ctx.font = 'bold 26px Arial';
    ctx.fillStyle = '#F59E0B';
    ctx.strokeText('CLICK TO PLAY AGAIN', canvas.width / 2, 340);
    ctx.fillText('CLICK TO PLAY AGAIN', canvas.width / 2, 340);
  }
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
