<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset Level Devil</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: #050505;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        canvas {
            display: block; margin: auto;
            width: min(100vw, 1000px); height: min(100vh, 560px);
            background: #e47a55;
        }
        #hud {
            position: fixed; top: 15px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 900px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; font-size: 18px; font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #screen {
            position: fixed; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.96);
            color: white;
        }
        #screen h1 { margin: 0 0 15px; font-size: 58px; letter-spacing: 3px; }
        #screen p { margin: 0; color: #cccccc; font-size: 20px; }
        .buttons { display: flex; gap: 15px; margin-top: 25px; }
        button {
            padding: 13px 28px; border: none; border-radius: 8px;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { transform: scale(1.06); }
        #playAgain { background: #e4774d; color: white; }
        #exit { background: #393039; color: white; }
    </style>
</head>
<body>

    <!-- GAME CANVAS & HUD -->
    <canvas id="game" width="1000" height="560"></canvas>
    <div id="hud">
        <span>LEVEL: <b id="levelText">1</b></span>
        <span>❤️ <b id="livesText">5</b></span>
        <span>A / D or ← / → &nbsp; | &nbsp; SPACE = JUMP</span>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="screen">
        <h1 id="screenTitle">GAME OVER</h1>
        <p id="screenMessage">You lost all your lives.</p>
        <div class="buttons">
            <button id="playAgain" onclick="restartGame()">▶ PLAY AGAIN</button>
            <button id="exit" onclick="exitGame()">✕ EXIT</button>
        </div>
    </div>

<script>
/* =====================================================
   CANVAS & UI SETUP
===================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const levelText = document.getElementById("levelText");
const livesText = document.getElementById("livesText");
const screen = document.getElementById("screen");
const screenTitle = document.getElementById("screenTitle");
const screenMessage = document.getElementById("screenMessage");

/* =====================================================
   GAME STATE & KEYBOARD INPUT
===================================================== */
let currentLevel = 1, lives = 5, gameRunning = true;
let deathAnimation = false, deathTimer = 0, gameTime = 0;
let levelTimer = 0;
let level3TrapStage = 1; // 1 = Block drops fully, 2 = Sun burns, 3 = Normal safe
let sunBurning = false, sunScale = 1;
let lavaBubbles = [];
const keys = {};

document.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === "Space") e.preventDefault();
});
document.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

/* =====================================================
   PLAYER OBJECT
===================================================== */
const player = {
    x: 55, y: 390, width: 24, height: 46,
    speed: 1.6, jumpPower: -10.8, velocityY: 0,
    grounded: false, walking: false, facing: 1, walkFrame: 0
};

/* =====================================================
   LEVEL OBJECTS & TRAPS
===================================================== */
let platforms = [], spikes = [], exitDoor = {};
let trollSpikes = [], fallingSpikes = [], doorMoved = false;

function initLavaBubbles() {
    lavaBubbles = [];
    for (let i = 0; i < 20; i++) {
        lavaBubbles.push({
            x: Math.random() * canvas.width,
            y: 510 + Math.random() * 40,
            radius: 2 + Math.random() * 5,
            speed: 0.3 + Math.random() * 0.7,
            alpha: 0.4 + Math.random() * 0.6
        });
    }
}

function createLevel() {
    platforms = [{ x: 0, y: 500, width: 1000, height: 60, collapsible: false, alive: true }];
    spikes = [];
    trollSpikes = [];
    fallingSpikes = [];
    doorMoved = false;
    levelTimer = 0;
    sunBurning = false;
    sunScale = 1;

    if (currentLevel === 1) createLevelOne();
    else if (currentLevel === 2) createLevelTwo();
    else createLevelThree();

    resetPlayer();
}

function createLevelOne() {
    platforms.push(
        { x: 120, y: 430, width: 150, height: 20 },
        { x: 340, y: 370, width: 150, height: 20 },
        { x: 560, y: 310, width: 140, height: 20 },
        { x: 770, y: 260, width: 130, height: 20 }
    );
    spikes.push({ x: 285, y: 480, width: 45, height: 20 });
    
    trollSpikes.push(
        { x: 460, y: 480, width: 50, height: 20, triggerX: 430, active: false },
        { x: 670, y: 480, width: 50, height: 20, triggerX: 620, active: false }
    );

    exitDoor = { x: 820, y: 210, width: 40, height: 50 };
}

function createLevelTwo() {
    platforms.push(
        { x: 100, y: 430, width: 130, height: 20, shrinkOnTouch: true },
        { x: 270, y: 370, width: 130, height: 20, moving: true, dir: 1, minX: 250, maxX: 350 },
        { x: 470, y: 310, width: 130, height: 20, shrinkOnTouch: true },
        { x: 650, y: 250, width: 130, height: 20, moving: true, dir: -1, minX: 600, maxX: 720 },
        { x: 800, y: 200, width: 120, height: 20 }
    );
    spikes.push(
        { x: 235, y: 480, width: 30, height: 20 },
        { x: 425, y: 480, width: 40, height: 20 }
    );
    exitDoor = { x: 840, y: 150, width: 40, height: 50 };
}

function createLevelThree() {
    platforms = [
        { x: 0, y: 450, width: 220, height: 20 },
        { x: 250, y: 370, width: 120, height: 20 },
        { x: 410, y: 290, width: 120, height: 20 },
        { x: 580, y: 220, width: 120, height: 20 },
        { x: 760, y: 160, width: 140, height: 20, falling: false, fallSpeed: 0 }
    ];
    
    fallingSpikes.push(
        { x: 300, y: 0, width: 30, height: 25, velocityY: 0, triggerX: 230, triggered: false },
        { x: 620, y: 0, width: 30, height: 25, velocityY: 0, triggerX: 540, triggered: false }
    );

    exitDoor = { x: 810, y: 110, width: 40, height: 50 };
    initLavaBubbles();
}

function resetPlayer() {
    player.x = 40; 
    player.y = 390;
    player.velocityY = 0;
    player.grounded = false; player.walking = false; player.walkFrame = 0;
}

function isColliding(a, b) {
    return (a.x < b.x + b.width && a.x + a.width > b.x &&
            a.y < b.y + b.height && a.y + a.height > b.y);
}

/* =====================================================
   PHYSICS & UPDATES
===================================================== */
function updatePlayer() {
    if (!gameRunning) return;
    levelTimer += 0.016;
    player.walking = false;

    if (!sunBurning) {
        if (keys["a"] || keys["arrowleft"]) {
            player.x -= player.speed;
            player.walking = true; player.facing = -1;
        }
        if (keys["d"] || keys["arrowright"]) {
            player.x += player.speed;
            player.walking = true; player.facing = 1;
        }
        if ((keys[" "] || keys["w"] || keys["arrowup"]) && player.grounded) {
            player.velocityY = player.jumpPower;
            player.grounded = false;
        }
    }

    player.velocityY += 0.40;
    player.y += player.velocityY;
    player.grounded = false;

    updateTrapsAndPlatforms();
    checkPlatformCollisions();

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

    checkSpikeCollision();

    // Check Lava Collision in Level 3
    if (currentLevel === 3) {
        const lavaY = 500;
        if (player.y + player.height >= lavaY) {
            if (level3TrapStage === 1 && player.x > 700) {
                level3TrapStage = 2; // Advance to Stage 2 after dying in lava from platform collapse
            }
            loseLife();
            return;
        }
    } else if (player.y > canvas.height + 30) {
        loseLife();
        return;
    }
    
    if (isColliding(player, exitDoor) && !sunBurning) completeLevel();

    player.walkFrame = (player.walking && player.grounded) ? player.walkFrame + 0.15 : 0;
}

function updateTrapsAndPlatforms() {
    if (currentLevel === 1) {
        trollSpikes.forEach(ts => {
            if (player.x > ts.triggerX) ts.active = true;
        });
        if (!doorMoved && player.x > 700 && player.y < 300) {
            exitDoor.x = 130; exitDoor.y = 380;
            doorMoved = true;
        }
    }

    if (currentLevel === 2) {
        platforms.forEach(p => {
            if (p.moving) {
                p.x += p.dir * 1.2;
                if (p.x < p.minX || p.x > p.maxX) p.dir *= -1;
            }
        });
    }

    if (currentLevel === 3) {
        fallingSpikes.forEach(fs => {
            if (!fs.triggered && player.x > fs.triggerX) fs.triggered = true;
            if (fs.triggered) {
                fs.velocityY += 0.5;
                fs.y += fs.velocityY;
            }
        });

        const topPlatform = platforms[4];

        // Stage 1 Trap: Top platform falls fully down into the lava
        if (level3TrapStage === 1 && player.x > 750 && player.y <= 170) {
            if (topPlatform) topPlatform.falling = true;
        }

        if (topPlatform && topPlatform.falling) {
            topPlatform.fallSpeed += 0.6; // Accelerate downward
            topPlatform.y += topPlatform.fallSpeed;
        }

        // Stage 2 Trap: Sun burns player
        if (level3TrapStage === 2 && player.x > 760 && !sunBurning) {
            sunBurning = true;
        }

        if (sunBurning) {
            sunScale += 0.18;
            if (sunScale > 8) {
                level3TrapStage = 3; // Advance to Stage 3 (Safe)
                loseLife();
            }
        }
    }
}

function checkPlatformCollisions() {
    for (const platform of platforms) {
        // Skip collision if platform is falling out underneath the player
        if (platform.falling) continue;

        if (player.x < platform.x + platform.width &&
            player.x + player.width > platform.x &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + 30 &&
            player.velocityY >= 0) {
            
            player.y = platform.y - player.height;
            player.velocityY = 0;
            player.grounded = true;

            if (platform.shrinkOnTouch && platform.width > 40) {
                platform.width -= 0.8;
                platform.x += 0.4;
            }
        }
    }
}

function checkSpikeCollision() {
    for (const spike of spikes) {
        if (isColliding(player, spike)) { loseLife(); return; }
    }
    for (const ts of trollSpikes) {
        if (ts.active && isColliding(player, ts)) { loseLife(); return; }
    }
    for (const fs of fallingSpikes) {
        if (isColliding(player, fs)) { loseLife(); return; }
    }
}

function loseLife() {
    lives--;
    livesText.textContent = lives;
    if (lives <= 0) beginDeathAnimation();
    else createLevel();
}

function beginDeathAnimation() {
    gameRunning = false; deathAnimation = true; deathTimer = 0;
    screen.style.display = "none";
}

function completeLevel() {
    currentLevel++;
    if (currentLevel > 3) {
        gameRunning = false;
        showScreen("🏆 YOU WON!", "You survived all the Devil traps!");
        return;
    }
    levelText.textContent = currentLevel;
    createLevel();
}

function showScreen(title, message) {
    screenTitle.textContent = title;
    screenMessage.textContent = message;
    screen.style.display = "flex";
}

function restartGame() {
    currentLevel = 1; lives = 5; level3TrapStage = 1;
    gameRunning = true; deathAnimation = false; deathTimer = 0;
    levelText.textContent = 1; livesText.textContent = 5;
    screen.style.display = "none";
    createLevel();
}

function exitGame() {
    gameRunning = false; deathAnimation = false;
    screen.style.display = "none";
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

/* =====================================================
   RENDERING & ENVIRONMENT
===================================================== */
function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, "#a94765");
    gradient.addColorStop(0.45, "#dd7054");
    gradient.addColorStop(1, "#f4b25e");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawFarMountains();
    drawNearMountains();
    drawSun();
}

function drawSun() {
    ctx.save();
    const sunX = 760, sunY = 110;
    const currentRadius = 58 * sunScale;
    
    ctx.beginPath();
    ctx.arc(sunX, sunY, currentRadius, 0, Math.PI * 2);
    ctx.fillStyle = sunBurning ? "#ff4500" : "#ffda78";
    ctx.fill();

    if (sunBurning) {
        ctx.beginPath();
        ctx.arc(sunX, sunY, currentRadius + 15, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 215, 0, 0.4)";
        ctx.fill();
    }
    ctx.restore();
}

function drawFarMountains() {
    ctx.fillStyle = "#995467";
    ctx.beginPath();
    ctx.moveTo(0, 450); ctx.lineTo(160, 300); ctx.lineTo(330, 450);
    ctx.lineTo(520, 310); ctx.lineTo(700, 450); ctx.lineTo(850, 320);
    ctx.lineTo(1000, 430); ctx.lineTo(1000, 560); ctx.lineTo(0, 560);
    ctx.closePath(); ctx.fill();
}

function drawNearMountains() {
    ctx.fillStyle = "#56394b";
    ctx.beginPath();
    ctx.moveTo(0, 480); ctx.lineTo(220, 350); ctx.lineTo(430, 480);
    ctx.lineTo(650, 350); ctx.lineTo(820, 470); ctx.lineTo(1000, 360);
    ctx.lineTo(1000, 560); ctx.lineTo(0, 560);
    ctx.closePath(); ctx.fill();
}

function drawPlatforms() {
    for (const platform of platforms) {
        ctx.fillStyle = "#432d2c";
        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
        ctx.fillStyle = "#79503d";
        ctx.fillRect(platform.x, platform.y, platform.width, 5);
    }
}

function drawLava() {
    const lavaY = 500;
    const lavaHeight = 60;

    // Glowing Lava Base Gradient
    const lavaGrad = ctx.createLinearGradient(0, lavaY, 0, canvas.height);
    lavaGrad.addColorStop(0, "#ff3300");
    lavaGrad.addColorStop(0.3, "#ff6600");
    lavaGrad.addColorStop(1, "#990000");

    ctx.fillStyle = lavaGrad;
    ctx.fillRect(0, lavaY, canvas.width, lavaHeight);

    // Animated Lava Surface Waves
    ctx.fillStyle = "#ffcc00";
    ctx.beginPath();
    ctx.moveTo(0, lavaY);
    for (let x = 0; x <= canvas.width; x += 20) {
        const waveY = lavaY + Math.sin((gameTime * 4) + (x * 0.05)) * 4;
        ctx.lineTo(x, waveY);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.lineTo(0, canvas.height);
    ctx.closePath();
    ctx.fill();

    // Lava Heat Bubbles Effect
    lavaBubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < lavaY - 2) {
            b.y = 550;
            b.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 230, 100, ${b.alpha})`;
        ctx.fill();
    });
}

function drawSpikes() {
    const allSpikes = [...spikes, ...trollSpikes.filter(ts => ts.active)];
    for (const spike of allSpikes) {
        for (let i = 0; i < spike.width; i += 15) {
            ctx.beginPath();
            ctx.moveTo(spike.x + i, spike.y + spike.height);
            ctx.lineTo(spike.x + i + 7.5, spike.y);
            ctx.lineTo(spike.x + i + 15, spike.y + spike.height);
            ctx.closePath();
            ctx.fillStyle = "#38232c";
            ctx.fill();
        }
    }

    for (const fs of fallingSpikes) {
        ctx.beginPath();
        ctx.moveTo(fs.x, fs.y);
        ctx.lineTo(fs.x + fs.width / 2, fs.y + fs.height);
        ctx.lineTo(fs.x + fs.width, fs.y);
        ctx.closePath();
        ctx.fillStyle = "#5e232c";
        ctx.fill();
    }
}

function drawDoor() {
    ctx.fillStyle = "#30232b";
    ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.width, exitDoor.height);
    ctx.strokeStyle = "#e5a55e"; ctx.lineWidth = 3;
    ctx.strokeRect(exitDoor.x, exitDoor.y, exitDoor.width, exitDoor.height);
    ctx.beginPath();
    ctx.arc(exitDoor.x + 29, exitDoor.y + 27, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd16b"; ctx.fill();
}

/* =====================================================
   CHARACTER RENDERING
===================================================== */
function drawCharacter(x, y, facing = 1, legAngle = 0, isDead = false) {
    ctx.save();
    ctx.translate(x, y);

    const headRadius = 9;
    const bodyHeight = 22;
    const idleBreath = isDead ? 0 : Math.sin(gameTime * 4) * 0.8;

    ctx.beginPath();
    ctx.arc(0, -11 + idleBreath, headRadius, 0, Math.PI * 2);
    ctx.fillStyle = "#ffdbac"; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#2b1e1a"; ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, -12 + idleBreath, headRadius + 0.5, Math.PI * 0.85, Math.PI * 2.15);
    ctx.fillStyle = "#3a2a2f"; ctx.fill();

    if (!isDead) {
        ctx.beginPath();
        ctx.arc(facing * 4, -12 + idleBreath, 2, 0, Math.PI * 2);
        ctx.fillStyle = "#1d1d1d"; ctx.fill();
    } else {
        ctx.strokeStyle = "#1d1d1d"; ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(facing * 3 - 2, -14); ctx.lineTo(facing * 3 + 2, -10);
        ctx.moveTo(facing * 3 + 2, -14); ctx.lineTo(facing * 3 - 2, -10);
        ctx.stroke();
    }

    ctx.fillStyle = "#c84b31";
    ctx.beginPath();
    ctx.roundRect(-7, -2 + idleBreath, 14, bodyHeight, 4);
    ctx.fill();
    ctx.strokeStyle = "#2b1e1a"; ctx.lineWidth = 2; ctx.stroke();

    ctx.strokeStyle = "#2b1e1a"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
    const armSwing = Math.sin(legAngle) * 10;
    
    ctx.beginPath();
    ctx.moveTo(-4, 3 + idleBreath); ctx.lineTo(-4 - armSwing, 16 + idleBreath);
    ctx.moveTo(4, 3 + idleBreath); ctx.lineTo(4 + armSwing, 16 + idleBreath);
    ctx.stroke();

    ctx.strokeStyle = "#1f1d2b"; ctx.lineWidth = 4;
    const legOffset = Math.sin(legAngle) * 8;

    ctx.beginPath();
    ctx.moveTo(-3, bodyHeight - 2 + idleBreath); ctx.lineTo(-4 - legOffset, bodyHeight + 17);
    ctx.moveTo(3, bodyHeight - 2 + idleBreath); ctx.lineTo(4 + legOffset, bodyHeight + 17);
    ctx.stroke();

    ctx.fillStyle = "#dedede";
    ctx.fillRect(-7 - legOffset, bodyHeight + 15, 6, 4);
    ctx.fillRect(1 + legOffset, bodyHeight + 15, 6, 4);

    ctx.restore();
}

function drawPlayer() {
    const centerX = player.x + player.width / 2;
    const topY = player.y;
    drawCharacter(centerX, topY + 14, player.facing, player.walkFrame, false);
}

/* =====================================================
   HORIZONTAL FALLING DEATH ANIMATION
===================================================== */
function drawDeathAnimation() {
    deathTimer += 0.016;

    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const dropDuration = 1.6;
    const progress = Math.min(deathTimer / dropDuration, 1);
    
    const easeInFall = progress * progress;
    const personX = 500;
    const startY = -60;
    const targetY = 465;
    const personY = startY + easeInFall * (targetY - startY);

    ctx.save();
    ctx.translate(personX, personY);
    
    const fallRotation = Math.min(progress * (Math.PI / 2), Math.PI / 2);
    ctx.rotate(fallRotation);

    drawCharacter(0, 0, 1, 0, true);
    ctx.restore();

    if (deathTimer >= dropDuration) {
        const impactTime = deathTimer - dropDuration;
        drawImpactEffect(personX, targetY + 20, impactTime);
    }

    if (deathTimer > 3.8) {
        deathAnimation = false;
        showScreen("GAME OVER", "You lost all 5 lives.");
    }
}

function drawImpactEffect(x, y, time) {
    const radius = Math.min(time * 120, 80);
    ctx.beginPath();
    ctx.ellipse(x, y, radius, radius * 0.3, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 140, 50, ${Math.max(1 - time * 0.8, 0)})`;
    ctx.lineWidth = 4;
    ctx.stroke();

    for (let i = 0; i < 5; i++) {
        const fireX = x + (Math.sin(time * 10 + i) * 35);
        const fireY = y - (time * 40) - (i * 5);
        ctx.beginPath();
        ctx.arc(fireX, fireY, Math.max(18 - time * 8, 2), 0, Math.PI * 2);
        ctx.fillStyle = i % 2 === 0 ? "#ff4500" : "#ffcc00";
        ctx.fill();
    }

    for (let i = 0; i < 25; i++) {
        const seed = i * 1.5;
        const ashX = x + Math.cos(seed) * (time * 60 + i * 2);
        const ashY = y - (time * 50) + Math.sin(seed) * 20;
        ctx.fillStyle = `rgba(180, 180, 180, ${Math.max(1 - time * 0.5, 0)})`;
        ctx.fillRect(ashX, ashY, 3, 3);
    }
}

/* =====================================================
   MAIN LOOP & INITIALIZATION
===================================================== */
function drawGame() {
    drawBackground();
    drawPlatforms();
    if (currentLevel === 3) drawLava();
    drawSpikes();
    drawDoor();
    drawPlayer();
}

function gameLoop(timestamp) {
    gameTime = timestamp / 1000;
    if (deathAnimation) {
        drawBackground();
        drawDeathAnimation();
    } else {
        updatePlayer();
        drawGame();
    }
    requestAnimationFrame(gameLoop);
}

createLevel();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
